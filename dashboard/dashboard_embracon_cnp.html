function bars(title,sub,rows,color,fmt){
 const mx=Math.max(...rows.map(r=>Math.abs(r.v)));
 return `<div class="bars"><div class="bt">${title}</div><div class="bs">${sub}</div>
 ${rows.map(r=>`<div class="brow${r.v<0?' neg':''}"><div class="bl">${E(r.n)}</div>
  <div class="tr"><div class="fl" style="left:0;width:${Math.max(1.2,Math.abs(r.v)/mx*100)}%;background:${r.v<0?'var(--rever)':(r.c||color)}"></div></div>
  <div class="bv">${fmt(r.v)}</div></div>`).join('')}</div>`;}
const node=(o)=>`<div class="node ${o.cls||''}"><div class="nm">${o.nm}</div>${o.cn?`<div class="cn">${o.cn}</div>`:''}${o.pp?`<div><span class="pp">${o.pp}</span></div>`:''}${o.rs?`<div class="rs">${o.rs}</div>`:''}</div>`;
function tree(title,sub,parents,apex){
 const W=Math.min(parents.length*180+(parents.length-1)*14,640);
 return `<div class="org"><div class="ot">${title}</div>${sub?`<div class="os">${sub}</div>`:''}
 <div class="row">${parents.map(p=>node({...p,cls:(p.cls||'')+' top'})).join('')}</div>
 <div class="stem"></div><div class="spine" style="width:${W}px;max-width:100%"></div><div class="stem"></div>
 <div class="row">${node({...apex,cls:'apex'})}</div></div>`;}

function renderVg(){document.getElementById('t-vg').innerHTML=`
 <h2>1. Visão geral da operação</h2>
 <p class="lead">Combinação dos negócios de administração de consórcio dos grupos Embracon (famílias Savian e Silva/Dutra) e CNP Assurances. A Embracon incorpora a CNP Consórcio e o grupo CNP fica com 40% da companhia combinada — 13,8% recebidos em ações na incorporação e ~26,2% comprados em dinheiro das holdings. Fontes: Acordo de 20.10.2025, Ofício BACEN 31070/2026 e calls/e-mails de agosto/2026.</p>
 ${kpis(D.vg.kpis)}
 <div class="tl">${D.vg.tl.map(s=>`<div class="st"><div class="stb"><div class="sy">${E(s.y)}</div><div class="sv">${E(s.t)}</div><div class="sd">${s.d}</div></div></div>`).join('')}</div>
 <div class="note info"><strong>A operação em essência.</strong> Juridicamente, uma incorporação de sociedade lavrada a valor patrimonial contábil (laudo art. 224 LSA) seguida de compra e venda de ações — o contrato não menciona CPC 15, CPC 19, PPA, mais-valia ou goodwill. Contabilmente, porém, a essência é uma combinação: a caracterização (CPC 15 × CPC 19) ficou inteiramente para a implementação, e é dela que decorre todo o tratamento contábil e fiscal.</div>
 <div class="note"><strong>A controvérsia em síntese.</strong> A Deloitte (auditora da Embracon, a quem cabe a definição) propõe tratar a operação como <em>joint operation</em> (CPC 19), com reavaliação a valor justo dos patrimônios da CNP <em>e</em> da Embracon lançada em resultado. A Stocche Forbes sustenta combinação de negócios (CPC 15): veto não é controle conjunto, as famílias seguem com 60% e o próprio contrato fala em "combinação de negócios". A premissa escolhida "vai carregar o tratamento tributário" (RC).</div>
 <div class="note neg"><strong>Por que importa.</strong> No CPC 19 o ganho de AVJ fica "carimbado" a 34% de IRPJ/CSLL com tributação diferida em subconta — "cai a tese do MEP", o passivo diferido entra no preço e "nunca mais vamos conseguir liquidar as holdings para vender pela PF". No CPC 15 há argumentos para neutralidade definitiva do reflexo nas holdings (linha WTorre), com a mais-valia compondo custo — o cenário "custo gordão" na alienação futura.</div>
 <div class="base"><h3>Status e premissas de leitura</h3><p class="sub">posição em 28.08.2026</p><dl>

  <dt>Fechamento</dt><dd>Pendente; etapas 1 e 2 simultâneas e interdependentes; Data Limite ≈ 20.01.2027</dd>
  <dt>Quem define o CPC</dt><dd>O auditor da Embracon (Deloitte). "Não atrapalha o closing, mas temos que aceitar isso" (Rafael Andrade)</dd>
  <dt>Escalas dos números</dt><dd>Valores contratuais (R$) × ilustrativos da DTT/razonetes (base 178/300/5.888) × planilha Molina (premissas de mai/2025). Não são comparáveis entre si — cada aba indica a base usada</dd>
 </dl></div>`;}
